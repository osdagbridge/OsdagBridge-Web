    <path d="M137 145h24v6h-9v66h9v6h-24v-6h9v-66h-9z" fill="#a0b51b" stroke="#4e5147" stroke-width="1.5"/>
  </symbol>

  <symbol id="girder-section" viewBox="0 0 400 310">
