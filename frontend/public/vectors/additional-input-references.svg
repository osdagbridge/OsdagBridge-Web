      <text x="290" y="171">d = 1390 mm</text>
      <text x="200" y="305" text-anchor="middle">b_fw = 490 mm</text>
      <text x="127" y="71" text-anchor="end">t_ft = 18 mm</text>
      <text x="116" y="264" text-anchor="end">b_ft = 22 mm</text>
      <text x="176" y="173" text-anchor="end">w_t = 8 mm</text>
