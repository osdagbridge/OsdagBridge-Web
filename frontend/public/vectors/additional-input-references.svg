    <path d="M60 60v100M70 60v100M80 60v100M130 60v100M210 60v100M290 60v100M370 60v100M450 60v100M530 60v100M610 60v100M690 60v100M770 60v100M850 60v100M920 60v100M930 60v100M940 60v100" fill="none" stroke="#90af13" stroke-width="2"/>
