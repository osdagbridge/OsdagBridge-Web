    <g fill="none" stroke="#90af13" stroke-width="1">
      <path d="M140 30h120M115 50v100" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M140 25v23M260 25v23M110 50h28M110 150h84M196 155v13M204 155v13M185 163h11M215 163h-11"/>
