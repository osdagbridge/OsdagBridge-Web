<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Fixed Desktop-style examples. Dimensions are labels, not calculated input values. -->
  <defs>
    <pattern id="concrete" width="32" height="12" patternUnits="userSpaceOnUse">
      <rect width="32" height="12" fill="#e4e4e1"/>
      <path d="M3 2l4 2-2 3zM19 5l5-2 2 5zM12 10l3-2 2 3z" fill="#77796f"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M8 4L0 0v8z" fill="context-stroke"/>
    </marker>
    <g id="girder" stroke="#4e5147" stroke-width="1.5" fill="#c5c7bd">
      <path d="M-12 0h24v6H3v66h9v6h-24v-6h9V6h-9z"/>
    </g>
    <g id="bridge">
      <g stroke="#85877a" stroke-width="2" fill="none">
        <path d="M149 150H852M149 219H852M149 150l117 69m-117 0 117-69m0 0 117 69m-117 0 117-69m0 0 117 69m-117 0 117-69m0 0 117 69m-117 0 117-69m0 0 117 69m-117 0 117-69m0 0 118 69m-118 0 118-69"/>
      </g>
      <use href="#girder" x="149" y="145"/><use href="#girder" x="266" y="145"/>
      <use href="#girder" x="383" y="145"/><use href="#girder" x="500" y="145"/>
      <use href="#girder" x="617" y="145"/><use href="#girder" x="734" y="145"/>
      <use href="#girder" x="852" y="145"/>
      <g fill="url(#concrete)" stroke="#77796f" stroke-width="1.5">
        <rect x="90" y="125" width="820" height="12"/>
        <path d="M90 125l5-45h7l6 45zM892 125l6-45h7l5 45z"/>
      </g>
    </g>
  </defs>

  <symbol id="typical" viewBox="0 0 1000 310">
    <use href="#bridge"/>
    <g stroke="#444" stroke-width="1" fill="none">
      <path d="M113 57V117M887 57V117M90 141v152M910 141v152M149 225v26M266 225v26M383 225v26" stroke-dasharray="2 2"/>
      <path d="M113 60H887M90 247H149M266 247H383M90 288H910" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M500 112v25" marker-end="url(#arrow)"/>
    </g>
    <g fill="#252525" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
      <text x="500" y="48">Carriageway Width = 15.00 m</text>
      <text x="500" y="106">Deck Thickness = 250 mm</text>
      <text x="119" y="237">Overhang = 1.14 m</text>
      <text x="325" y="237">Girder Spacing = 2.27 m</text>
      <text x="500" y="278">Overall Bridge Width = 15.90 m</text>
    </g>
  </symbol>

  <symbol id="girder-overview" viewBox="0 75 1000 165">
