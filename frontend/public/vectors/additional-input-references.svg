      <path d="M50 30h40v7H73v116h17v7H50v-7h17V37H50zM310 30h40v7h-17v116h17v7h-40v-7h17V37h-17z"/>
      <path d="M73 50h254M73 143h254M73 50l254 93M73 143 327 50"/>
    </g>
    <g fill="#90af13" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      <text x="70" y="195">Girder G1</text><text x="330" y="195">Girder G2</text>
    </g>
  </symbol>

  <symbol id="angle" viewBox="0 0 400 200">
